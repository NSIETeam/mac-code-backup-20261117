<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>手机文件</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px 20px;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px}.card{padding:20px;background:#fff;border:1.5px solid #1d1d1f;border-radius:20px}label,button{display:flex;align-items:center;justify-content:center;width:100%;height:48px;padding:0 16px;border:1.5px solid #1d1d1f;border-radius:16px;background:#fff;color:#1d1d1f;font:600 16px -apple-system,BlinkMacSystemFont,sans-serif;margin:16px 0 0}label{margin-top:0;background:#1d1d1f;color:#fff}button[disabled]{background:#e9e9ed;color:#929298}.muted{color:#6e6e73;font-size:14px;line-height:1.7;margin-top:16px;overflow-wrap:anywhere}#status{white-space:pre-line}progress{width:100%;height:8px;margin-top:16px}input{position:absolute;width:1px;height:1px;opacity:0}#error{color:#b9352b}#preview{white-space:pre-line}#file-label{pointer-events:auto}
</style><script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script></head><body><div class="card"><label id="file-label" for="file">选择手机文件</label><input id="file" type="file"><div id="name" class="muted">从“文件”、下载目录或云盘中选择。</div><button id="upload" disabled>上传并预览</button><progress id="progress" max="100" value="0" hidden></progress><div id="status" class="muted" aria-live="polite"></div><div id="preview" class="muted"></div><div id="error" class="muted" role="alert"></div><button id="return" hidden>返回小程序</button></div><div class="muted" id="tip"></div><script>
'use strict';
const mode='__MODE__', picker=document.getElementById('file'), submit=document.getElementById('upload'), name=document.getElementById('name'), status=document.getElementById('status'), error=document.getElementById('error'), preview=document.getElementById('preview'), progress=document.getElementById('progress');
const ext=mode==='roster'?['xlsx']:(mode==='handout'||mode==='book')?['doc','docx','pdf']:['pdf','doc','docx','png','jpg','jpeg'];
picker.accept=ext.map(x=>'.'+x).join(',');document.getElementById('tip').textContent=mode==='roster'?'Excel 第一列姓名、第二列学号，首行为标题。最大5MB。':'支持 '+ext.join('、').toUpperCase()+'，最大50MB。';
if(mode==='roster')submit.textContent='检查名单';let busy=false,confirmed=false,target='';
picker.addEventListener('change',()=>{const f=picker.files[0];confirmed=false;preview.textContent='';error.textContent='';status.textContent='';submit.textContent=mode==='roster'?'检查名单':'上传并预览';submit.disabled=!f;if(!f)return;name.textContent=f.name;const suffix=f.name.split('.').pop().toLowerCase();if(!ext.includes(suffix)||!f.size||f.size>(mode==='roster'?5:50)*1024*1024){error.textContent='文件格式或大小不符合要求，请重新选择。';submit.disabled=true;}});
function openMiniProgram(){try{if(window.wx&&wx.miniProgram){wx.miniProgram.redirectTo({url:target});return;}}catch(e){}status.textContent='上传成功，请返回小程序查看。';}
submit.addEventListener('click',()=>{if(busy||!picker.files[0])return;busy=true;submit.disabled=true;picker.disabled=true;document.getElementById('file-label').style.pointerEvents='none';error.textContent='';status.textContent='正在上传…';progress.hidden=false;progress.value=0;const data=new FormData();data.append('file',picker.files[0]);if(confirmed)data.append('commit','true');const xhr=new XMLHttpRequest();xhr.open('POST',location.pathname.replace(/\/$/,'')+'/file');xhr.timeout=150000;xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=Math.round(e.loaded/e.total*100)};function finish(){busy=false;submit.disabled=false;picker.disabled=false;document.getElementById('file-label').style.pointerEvents='auto';progress.hidden=true;}xhr.onload=()=>{finish();let result;try{result=JSON.parse(xhr.responseText)}catch(e){error.textContent='服务器返回异常，请重试。';return;}if(xhr.status<200||xhr.status>=300){error.textContent=result.message||'上传失败，请重试。';status.textContent='';return;}if(mode==='roster'&&!result.committed&&!result.url){confirmed=true;preview.textContent='检测到 '+result.rows.length+' 名学生：\n'+result.rows.slice(0,5).map(x=>x.name+' · '+x.code).join('\n');status.textContent='确认后导入当前班级。';submit.textContent='确认导入名单';return;}target=result.url;submit.disabled=true;status.textContent='上传成功，正在返回小程序…';document.getElementById('return').hidden=false;openMiniProgram();};xhr.onerror=xhr.ontimeout=()=>{finish();status.textContent='';error.textContent='网络中断，请重试。重复提交不会重复导入。';};xhr.send(data);});
document.getElementById('return').addEventListener('click',openMiniProgram);
</script></body></html>
