<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>思跃 · 限定试点</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./math/katex.min.css">
  <script src="./math/katex.min.js" defer></script>
  <script src="./math/contrib/auto-render.min.js" defer></script>
  <script src="./homework-workflow.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <section id="login-view" class="login-screen">
    <div class="login-card">
      <h1>账号登录</h1>
      <p class="muted">仅已开通的试点账号可使用。</p>
      <form id="login-form">
        <label class="field">登录账号<input id="login-account" name="account" autocomplete="username" required maxlength="100"></label>
        <label class="field">密码<input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="primary login-submit" type="submit">登录</button>
      </form>
    </div>
  </section>

  <div id="app-view" hidden>
    <header class="app-header">
      <strong id="app-heading">教务工作台 <span class="beta-tag">Beta</span></strong>
      <div class="header-account"><button id="return-class-button" class="text-button" type="button" hidden>返回班级</button><span id="account-name"></span><button id="refresh-button" class="text-button" type="button">刷新</button><button id="logout-button" class="text-button" type="button">退出</button></div>
    </header>
    <main class="workspace">
      <nav id="module-nav" class="module-nav" aria-label="教务功能"></nav>
      <p id="app-error" class="notice error-notice" role="alert" hidden></p>
      <div class="module-toolbar"><h1 id="module-title"></h1><label class="field session-field">课次<select id="session-select"><option value="">正在读取课次…</option></select></label></div>
      <div id="work-grid" class="work-grid full-width">
        <aside id="roster-panel" class="roster-panel panel" aria-label="选择学生" hidden>
          <div id="student-list" class="student-list"></div>
        </aside>
        <section id="detail-panel" class="detail-panel" aria-label="教务内容">
          <div class="empty-panel panel">正在读取…</div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
