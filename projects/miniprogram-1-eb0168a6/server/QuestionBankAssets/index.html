<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>思悦共享题库</title><link rel="stylesheet" href="style.css?v=20261103-underline1"><link rel="stylesheet" href="math/katex.min.css"><script defer src="math/katex.min.js"></script><script defer src="math/contrib/auto-render.min.js"></script><script type="module" src="app.mjs?v=20261102-simple2"></script></head><body><main>
<header class="top"><a class="brand" href="./" aria-label="思跃 AI 实验室 · 共享题库" title="思跃 AI 实验室"><span class="brand-mark"><img src="siyue-ai-logo.png?v=20261102-transparent1" alt="思跃 AI 实验室" width="44" height="34" decoding="async" fetchpriority="high"></span></a><nav id="bank-nav" aria-label="题库功能" hidden><button data-view="search" class="active">找题</button><button data-view="upload">上传题目</button><button data-view="mine">我的上传</button></nav><div id="account-tools" hidden><span id="account-name"></span><button id="logout" class="text-button">退出</button></div></header>
<section id="login-panel" class="panel" hidden><h1>员工登录</h1><p class="muted">使用小程序或备课工作台的员工账号。普通教师也可上传与共享题目。</p><form id="login-form"><label>账号<input id="login-account" name="username" autocomplete="username" required maxlength="100"></label><label>密码<input id="login-password" type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" type="submit">登录题库</button></form><p id="login-message" role="alert"></p></section>
<div id="workspace" hidden>
<section id="view-search" class="bank-layout"><aside class="panel knowledge-panel"><details id="knowledge-directory"><summary>知识点目录</summary><p class="muted">高中知识点 · 按专题逐级查找</p><input id="knowledge-search" aria-label="搜索知识点目录" placeholder="搜索知识点或别名" maxlength="100"><div id="knowledge-tree" class="knowledge-tree" aria-live="polite"></div></details></aside><div class="bank-content"><div class="panel"><div class="search-title"><h1>按知识点找同类题</h1><span class="bank-stat"><strong id="catalog-count">—</strong> 道</span></div><form id="search-form"><div class="query-line"><input id="topic" aria-label="题目类型或知识点" placeholder="输入知识点、题型或题目内容" required maxlength="10000"><button type="button" id="filter-toggle" class="icon-button" aria-label="筛选题目" aria-expanded="false" aria-controls="filters-panel" title="筛选题目"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2v-9L3 4Z"/></svg></button><div id="filters-panel" class="filter-popover" hidden><div class="fields three"><label>学科<select id="search-subject"></select></label><label>学段<select id="search-stage"></select></label><label>题型<select id="search-type"></select></label></div><button type="button" id="filters-done" class="secondary">完成筛选</button></div></div><div class="search-actions"><button class="primary" id="search-button" type="submit">查找</button><button class="secondary" id="learner-open" type="button">选学员推荐</button><span id="filter-summary" class="muted"></span></div></form></div><p id="search-message" role="status"></p><div id="results"></div><button id="next-batch" class="secondary" hidden>换一批</button></div></section>
<section id="view-upload" hidden><div class="panel intake-panel"><h1>上传题目</h1><div id="drop-zone" class="drop-zone" role="group" aria-label="拖入或选择题目图片和资料文件"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg><h2>把题目或资料拖到这里</h2><p class="muted">图片、PDF、Word、TXT · 每份20MB以内，PDF和Word最多25页</p><div class="actions"><button id="choose-files" class="primary" type="button">选择图片或资料</button><button id="take-photo" class="secondary" type="button">拍照上传</button></div></div><input id="intake-files" class="visually-hidden" tabindex="-1" aria-hidden="true" type="file" multiple accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff,.pdf,.doc,.docx,.txt,.md"><input id="camera-file" class="visually-hidden" tabindex="-1" aria-hidden="true" type="file" accept="image/*" capture="environment"><p id="intake-message" role="status"></p><div id="intake-jobs"></div><div id="intake-review"></div></div></section>
<section id="view-mine" hidden><div class="section-heading"><h1>我的上传</h1><button class="secondary" id="reload-mine">刷新</button></div><p class="muted">可撤回或恢复自己上传的题目；撤回后停止共享，原内容仍保留。</p><p id="mine-message" role="status"></p><div id="my-intakes"></div><div id="my-questions"></div><div class="actions"><button class="secondary" id="mine-prev">上一页</button><span id="mine-page">1</span><button class="secondary" id="mine-next">下一页</button></div></section>
</div></main><dialog id="learner-dialog" aria-labelledby="learner-title"><div class="section-heading"><h2 id="learner-title">选择现有学员</h2><button id="learner-close" type="button" class="icon-button" aria-label="关闭学员选择">×</button></div><p id="learner-topic" class="muted"></p><label>班级与课程<select id="learner-group"></select></label><input id="learner-query" aria-label="搜索学员" placeholder="搜索学员姓名" maxlength="60"><div id="learner-list" class="learner-list"></div><p id="learner-message" role="status"></p><button id="learner-submit" class="primary" type="button">为所选学员推荐</button></dialog></body></html>
