<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>思小跃消息路由测试</title><style>body{font:16px system-ui;max-width:780px;margin:40px auto;padding:20px}textarea{box-sizing:border-box;width:100%;min-height:100px;font:inherit;padding:12px}button{padding:10px 20px;margin-top:12px}pre{white-space:pre-wrap;background:#f3f4f5;padding:20px}</style></head><body><h1>思小跃消息路由测试</h1><p>使用当前提交的真实路由代码。这里只模拟输入与回复，不连接企业微信、不发送消息。</p><form><label>模拟老师发来的消息<textarea name="message">请假怎么申请？</textarea></label><button>查看路由结果</button></form><pre id="result" aria-live="polite"></pre><script type="module">import {createRouter} from './routing.mjs';const route=createRouter();document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const result=await route(document.querySelector('textarea').value);document.querySelector('#result').textContent=typeof result==='string'?result:JSON.stringify(result,null,2)}catch(error){document.querySelector('#result').textContent=error.message}};</script></body></html>
