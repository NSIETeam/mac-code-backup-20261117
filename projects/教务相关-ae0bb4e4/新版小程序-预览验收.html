        return () =&gt; {};
      },

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              }

      } catch {
        return;
      }
      hostPort = nextHostPort;

    }

(()=&gt;{

const q=[{label:&#x27;例1&#x27;,text:&#x27;已知一次函数 y = 2x + 1，求它的图像与 x 轴、y 轴的交点坐标。&#x27;,answer:&#x27;与 x 轴交于（−½，0），与 y 轴交于（0，1）。&#x27;},{label:&#x27;练1&#x27;,text:&#x27;一次函数的图像经过 A（1，3）、B（3，7），求这个函数的表达式。&#x27;,answer:&#x27;将两点坐标代入 y = kx + b，解得 k = 2，b = 1。&#x27;},{label:&#x27;练2&#x27;,text:&#x27;已知 y = −2x + 4，当 y &gt; 0 时，求自变量 x 的取值范围。&#x27;,answer:&#x27;−2x + 4 &gt; 0，解得 x &lt; 2。&#x27;}];

function nav(_title,back){return `&lt;div class=&quot;sy-nav&quot;&gt;${back?icon(&#x27;chevron-left&#x27;,&#x27;返回&#x27;,back):&#x27;&#x27;}&lt;span class=&quot;sy-nav-space&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;div class=&quot;sy-capsule&quot; aria-label=&quot;微信小程序菜单&quot;&gt;${ico(&#x27;ellipsis&#x27;)}${ico(&#x27;circle-dot&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}

function classRows(){return s.classes.filter(c=&gt;c.name.includes(filter)).map(c=&gt;`&lt;div class=&quot;sy-list-row&quot;&gt;&lt;button class=&quot;sy-open&quot; data-a=&quot;class&quot; data-v=&quot;${c.id}&quot;&gt;&lt;strong&gt;${esc(c.name)}&lt;/strong&gt;&lt;span&gt;${esc(c.campus)} · ${esc(c.time)}&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;sy-tools&quot;&gt;${icon(&#x27;pencil&#x27;,&#x27;编辑班级 &#x27;+c.name,&#x27;edit-class&#x27;,c.id)}${icon(&#x27;trash-2&#x27;,&#x27;删除班级 &#x27;+c.name,&#x27;delete-class&#x27;,c.id)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;sy-empty&quot;&gt;没有匹配的班级&lt;/div&gt;&#x27;;}

function lessonPage(){const l=lesson();return `${nav(&#x27;讲次&#x27;,&#x27;class&#x27;)}&lt;main class=&quot;sy-main&quot;&gt;&lt;div class=&quot;sy-kicker&quot;&gt;${esc(cls().name)} / 第${l.n}讲&lt;/div&gt;&lt;div class=&quot;sy-row&quot;&gt;&lt;h1 class=&quot;sy-grow&quot;&gt;${esc(l.title)}&lt;/h1&gt;${icon(&#x27;pencil&#x27;,&#x27;编辑当前讲次&#x27;,&#x27;edit-lesson&#x27;,l.id)}&lt;/div&gt;&lt;p class=&quot;sy-muted sy-gap&quot;&gt;3 道题 · 讲义原稿已保留&lt;/p&gt;&lt;div class=&quot;sy-panel&quot;&gt;&lt;div class=&quot;sy-row sy-between&quot;&gt;&lt;h3&gt;本讲题目&lt;/h3&gt;${btn(&#x27;课前校对&#x27;,&#x27;review&#x27;,&#x27;&#x27;,&#x27;sy-link&#x27;)}&lt;/div&gt;${q.map((x,i)=&gt;`&lt;button class=&quot;sy-open sy-list-row&quot; data-a=&quot;review&quot; data-v=&quot;${i}&quot;&gt;&lt;div&gt;&lt;span class=&quot;sy-question-tag&quot;&gt;${x.label}&lt;/span&gt;&lt;p&gt;${esc(x.text)}&lt;/p&gt;&lt;/div&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;sy-actions&quot;&gt;${btn(ico(&#x27;users-round&#x27;)+&#x27; 课堂标记&#x27;,&#x27;mark&#x27;,&#x27;&#x27;,&#x27;sy-primary sy-wide&#x27;)}&lt;/div&gt;&lt;div class=&quot;sy-row sy-between sy-gap&quot;&gt;&lt;span class=&quot;sy-muted&quot;&gt;${s.saved.length}/${s.students.length} 人已完成标记&lt;/span&gt;${btn(&#x27;预览错题本&#x27;,&#x27;preview&#x27;,&#x27;&#x27;,&#x27;sy-link&#x27;)}&lt;/div&gt;&lt;/main&gt;`;}
function questionBlock(i,withChoice=false){const x=q[i];return `&lt;div class=&quot;sy-panel&quot;&gt;${withChoice?`&lt;label class=&quot;sy-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-select=&quot;${i}&quot; ${selected.includes(i)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${x.label} · 原稿第 ${i+2} 页&lt;/span&gt;&lt;/label&gt;`:`&lt;div class=&quot;sy-row sy-between&quot;&gt;&lt;span class=&quot;sy-question-tag&quot;&gt;${x.label}&lt;/span&gt;&lt;span class=&quot;sy-muted&quot;&gt;原稿第 ${i+2} 页&lt;/span&gt;&lt;/div&gt;`}&lt;div class=&quot;sy-stem&quot;&gt;${esc(x.text)}&lt;/div&gt;${i===0?`&lt;svg viewBox=&quot;0 0 300 120&quot; role=&quot;img&quot; aria-label=&quot;一次函数 y 等于 2x 加 1 的示意图&quot; style=&quot;display:block;width:100%;height:auto;max-height:120px&quot;&gt;&lt;line x1=&quot;25&quot; y1=&quot;85&quot; x2=&quot;275&quot; y2=&quot;85&quot; stroke=&quot;var(--sy-muted)&quot;/&gt;&lt;line x1=&quot;110&quot; y1=&quot;110&quot; x2=&quot;110&quot; y2=&quot;8&quot; stroke=&quot;var(--sy-muted)&quot;/&gt;&lt;line x1=&quot;80&quot; y1=&quot;115&quot; x2=&quot;132&quot; y2=&quot;11&quot; stroke=&quot;var(--sy-green)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;118&quot; y=&quot;101&quot; fill=&quot;var(--sy-muted)&quot; font-size=&quot;12&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;276&quot; y=&quot;82&quot; fill=&quot;var(--sy-muted)&quot; font-size=&quot;12&quot;&gt;x&lt;/text&gt;&lt;text x=&quot;116&quot; y=&quot;12&quot; fill=&quot;var(--sy-muted)&quot; font-size=&quot;12&quot;&gt;y&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;37&quot; fill=&quot;var(--sy-ink)&quot; font-size=&quot;12&quot;&gt;y = 2x + 1&lt;/text&gt;&lt;/svg&gt;`:&#x27;&#x27;}&lt;details&gt;&lt;summary class=&quot;sy-link&quot;&gt;查看参考答案&lt;/summary&gt;&lt;p class=&quot;sy-muted&quot;&gt;${esc(x.answer)}&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;`;}

    ).filter((candidate) =&gt; !candidate.matches(disabled));
